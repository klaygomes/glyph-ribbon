<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
<title>Glyph Ribbon</title>
<link rel="stylesheet" href="./demo/style.css">
<script type="module" src="./demo/main.js"></script>
</head>
<body>
<div class="pin">
  <section class="hero">
    <glyph-ribbon id="hero-ribbon" scroll-target=".pin"></glyph-ribbon>
    <div class="copy">
      <h1>Pure math<span>no baked frames</span></h1>
      <p>1,400 glyphs riding a coil, projected by hand and scattered by scroll.</p>
    </div>
  </section>
</div>

<section class="playground" aria-labelledby="playground-title">
  <header>
    <h2 id="playground-title">Playground</h2>
    <p>Tune the ribbon, then copy the options object.</p>
  </header>
  <div class="layout">
    <div class="stage">
      <glyph-ribbon id="preview" smoothing="0" intro="false"></glyph-ribbon>
      <label class="row">
        <span>progress</span>
        <input type="range" id="progress" min="0" max="1" step="0.001" value="0">
        <output for="progress"></output>
      </label>
    </div>
    <form class="controls" id="controls">
      <fieldset>
        <legend>Glyphs</legend>
        <label class="row"><span>text</span><input type="text" name="glyphs" value="tunrs" maxlength="40" autocomplete="off"></label>
        <label class="check"><input type="checkbox" name="dot" checked> dot (weight 0.15)</label>
        <label class="check"><input type="checkbox" name="image"> image glyph (weight 0.05)</label>
        <label class="row"><span>maxGlyphs</span><input type="range" name="maxGlyphs" min="100" max="4000" step="50" value="1400"><output></output></label>
        <label class="row"><span>seed</span><input type="number" name="seed" value="1337" step="1"></label>
      </fieldset>
      <fieldset>
        <legend>Coil</legend>
        <label class="row"><span>turns</span><input type="range" name="turns" min="1" max="8" step="0.1" value="3.5"><output></output></label>
        <label class="row"><span>speed</span><input type="range" name="speed" min="0" max="0.4" step="0.005" value="0.085"><output></output></label>
        <label class="row"><span>anchor.x</span><input type="range" name="anchorX" min="0" max="1" step="0.01" value="0.62"><output></output></label>
        <label class="row"><span>anchor.y</span><input type="range" name="anchorY" min="0" max="1" step="0.01" value="0.5"><output></output></label>
      </fieldset>
      <fieldset>
        <legend>Timeline</legend>
        <label class="row"><span>centre start</span><input type="range" name="centre0" min="0" max="1" step="0.01" value="0"><output></output></label>
        <label class="row"><span>centre end</span><input type="range" name="centre1" min="0" max="1" step="0.01" value="0.45"><output></output></label>
        <label class="row"><span>zoom start</span><input type="range" name="zoom0" min="0" max="1" step="0.01" value="0.05"><output></output></label>
        <label class="row"><span>zoom end</span><input type="range" name="zoom1" min="0" max="1" step="0.01" value="0.85"><output></output></label>
        <label class="row"><span>scatter start</span><input type="range" name="scatter0" min="0" max="1" step="0.01" value="0.05"><output></output></label>
        <label class="row"><span>scatter end</span><input type="range" name="scatter1" min="0" max="1" step="0.01" value="0.85"><output></output></label>
      </fieldset>
      <fieldset>
        <legend>Motion</legend>
        <label class="row"><span>motion</span>
          <select name="motion">
            <option value="auto">auto</option>
            <option value="full">full</option>
            <option value="reduced">reduced</option>
          </select>
        </label>
      </fieldset>
    </form>
  </div>
  <div class="config">
    <div class="config-head">
      <h3>Options</h3>
      <button type="button" id="copy">Copy config</button>
    </div>
    <pre id="config"></pre>
  </div>
</section>

<section class="after">Scroll back up.</section>
</body>
</html>
